落ち着いている場所です.</p>

<h2>前田と小島の関わり</h2>
<p>それは単純に,&nbsp; 生まれたところが熊本で,&nbsp; 母の実家が小島にあったというだけだ. </p>
<p>魅力的なのは周りに何もない自然と農地と川しかない静かな場所であるところだ.&nbsp; 私がこうして自然界隈の人間になったのもこの環境のせいでないかと考えている.</p>
